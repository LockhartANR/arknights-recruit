# Nginx 子域名路由配置
#
# 本文件是线上 /etc/nginx/sites-available/arknights 的同步副本，不是用来直接覆盖的模板。
#
# 为什么不直接从仓库拷到服务器：
#   线上配置由 Certbot 直接管理（listen 443 ssl / 证书路径 / 80→443 重定向块均带
#   "managed by Certbot" 标记）。历史上本仓库这份文件一度停留在「只有 80 端口」的
#   旧版本，若照旧说明执行 `sudo cp nginx.conf /etc/nginx/sites-available/arknights`，
#   会让全部域名的 HTTPS 立即中断。
#
# 正确做法：
#   - 只想改站点配置 → 直接在服务器上编辑线上文件，改完再反哺回本文件。
#       sudo cp /etc/nginx/sites-available/arknights /etc/nginx/sites-available/arknights.bak
#       sudoedit /etc/nginx/sites-available/arknights
#       sudo nginx -t && sudo systemctl reload nginx
#   - 确认本文件已等于线上内容 → 可以安全地：
#       sudo cp nginx.conf /etc/nginx/sites-available/arknights
#       sudo nginx -t && sudo systemctl reload nginx
#
# 同步核对（只读，服务器上执行）：
#   /usr/bin/python3 scripts/check_nginx_config.py
#   它比对「有效指令多重集 + server 块数量」。不要用哈希或 diff：
#   本文件多出上面这段警示注释，且块顺序可能与线上不同。
#
# 当前包含的站点：lockhart.ren / ark.lockhart.ren / blog.lockhart.ren /
#                bgm.lockhart.ren（含 *.bgm 通配 + /__auth 认证）/
#                bangumi.lockhart.ren（已废弃，后端移除，保留域名）
#
# 服务器上的 sudo 需要密码，因此 arknights-recruit/update.sh 会跳过 nginx 校验与重载。
# 凡涉及 nginx 的改动，必须人工执行 nginx -t 与 reload。

server {
    server_name lockhart.ren www.lockhart.ren;

    root /home/arknights/landing/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lockhart.ren/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lockhart.ren/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}

# ===== 明日方舟公招统计 =====
server {
    server_name ark.lockhart.ren;

    root /home/arknights/arknights-recruit/client/dist;
    index index.html;

    # API 反向代理到 Express
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lockhart.ren/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lockhart.ren/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ===== 博客 =====
server {
    server_name blog.lockhart.ren;

    root /home/arknights/blog/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lockhart.ren/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lockhart.ren/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.lockhart.ren) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = lockhart.ren) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name lockhart.ren www.lockhart.ren;
    return 404; # managed by Certbot




}
server {
    if ($host = ark.lockhart.ren) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ark.lockhart.ren;
    return 404; # managed by Certbot


}
server {
    if ($host = blog.lockhart.ren) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name blog.lockhart.ren;
    return 404; # managed by Certbot


}# ===== Bangumi Mirror =====
server {
    server_name bangumi.lockhart.ren;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lockhart.ren/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lockhart.ren/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = bangumi.lockhart.ren) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bangumi.lockhart.ren;
    return 404; # managed by Certbot
}

# bgm.lockhart.ren —— 私人 Bangumi 反代镜像
#
# 架构：
#   nginx（TLS 终止 + 访问认证）
#     ├── /__auth/*  → 认证服务 127.0.0.1:3002（登录页 / 登出 / auth_request 校验）
#     └── /*         → Mirrox  127.0.0.1:3001（反代 bgm.tv + 域名改写）
#
# 认证为什么必须在这里：Mirrox 自身只有 Host 白名单（未配置域名返回 421，
# 用于防止服务变成开放代理），**没有任何用户认证能力**。只部署 Mirrox 的话，
# 任何访问者都能看到完整镜像内容。
#
# 为什么认证端点走路径前缀而不是独立子域：
#   通配 DNS *.bgm.lockhart.ren 不覆盖 auth.bgm.lockhart.ren（多一层），
#   用路径前缀就只依赖已经生效的通配记录，少一个可出错的环节。
#   /__auth/ 这个前缀在 bgm.tv 上不存在，因此不会与镜像内容冲突。
#
# 证书：*.bgm.lockhart.ren + bgm.lockhart.ren，acme.sh 签发并自动续期，
# 位于 /home/arknights/certs/bgm.lockhart.ren/。nginx 以 www-data 运行，
# 该路径必须对 others 可读（目录 755、文件 644）。

