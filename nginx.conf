# ===== HTTP → HTTPS =====
server {
    listen 80;
    server_name bgm.lockhart.ren *.bgm.lockhart.ren;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== 镜像主体（需认证）=====
server {
    # nginx 1.24 的写法；1.25.1+ 才支持单独的 `http2 on;` 指令。
    listen 443 ssl http2;
    server_name bgm.lockhart.ren *.bgm.lockhart.ren;

    ssl_certificate     /home/arknights/certs/bgm.lockhart.ren/fullchain.pem;
    ssl_certificate_key /home/arknights/certs/bgm.lockhart.ren/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 原站有云盘/大图，放宽请求体上限。
    client_max_body_size 64m;


    # ---- 认证端点：必须先于任何鉴权匹配，否则登录页自己会被要求登录 ----
    # 使用 ^~ 前缀匹配，跳过正则匹配。
    location ^~ /__auth/ {
        # 去掉 /__auth 前缀后转发：/__auth/login -> /login
        rewrite ^/__auth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 登录相关响应不得缓存。
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        # 登录页也要 noindex。
        # 必须写在这里：本 location 有自己的 add_header，不会继承父级的，
        # 而「私人站登录页被搜索引擎收录」是最不该发生的情况 —— 那等于给站点打广告。
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- 浏览器自动请求的资源：必须免鉴权 ----
    # 否则会形成重定向死循环：页面加载 → 浏览器取 /favicon.ico → 被 auth_request 拦
    # → 302 回登录页 → 登录页又要 favicon → 再被拦…… 页面永远「加载中」，
    # 表现为点击登录按钮「没反应」。
    #
    # 踩过的坑：第一版只放行了 apple-touch-icon，但 bgm.tv 页面声明的是
    # **apple-touch-icon-precomposed**（名字不同！），仍然被拦。所以这里改成
    # 前缀匹配放行整类图标，避免再漏。这些资源无内容可泄漏，用 204 结束最省事。
    location ^~ /apple-touch-icon     { return 204; }
    location = /favicon.ico           { return 204; }
    location = /favicon.png           { return 204; }
    location = /robots.txt            { return 204; }
    location = /manifest.json         { return 204; }
    location = /site.webmanifest      { return 204; }
    location = /service-worker.js     { return 204; }
    location = /browserconfig.xml     { return 204; }
    location = /.well-known/security.txt { return 204; }

    location ^~ /assets/ {
        auth_request /__auth_verify;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关于 /assets/ 的适用范围（实测澄清）：
        #   * bgm.tv 的静态资源走 /img/ 与 /js/，**不用 /assets/**，所以这一段对
        #     bgm 镜像基本是空转 —— 好在 bgm.tv 自己就带了缓存头
        #     （ico_ios.png 30 天、pngfixed.js 8 天），镜像透传即可。
        #   * 真正受益的是 arknights-recruit：Vite 产物就在 /assets/ 下，
        #     而它此前**完全没有 Cache-Control**，浏览器每次访问都要回源校验。
        #   实测确认 bgm.tv 上 /assets/ 返回 404（空闲路径），因此不会误伤镜像内容。
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- 内部：未登录时跳转到登录页 ----
    location = /__auth_verify {
        internal;
        proxy_pass http://127.0.0.1:3002/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        proxy_set_header Host              $host;
        proxy_set_header X-Original-URI    $request_uri;
    }

    # ---- 未登录 → 登录页 ----
    error_page 401 = @redirect_to_login;

    location / {
        auth_request /__auth_verify;

        # 私人站：明确要求搜索引擎不收录。
        # 必须写在 location 里 —— nginx 的 add_header 不会可靠地从 server
        # 继承到 location（子级一旦声明自己的 add_header，父级的即全部失效），
        # 所以放在 server 块那份实际上没生效（实测确认）。
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # 必须显式设置 Host：Mirrox 靠 Host 头匹配路由，
        # 默认会转发成 127.0.0.1:3001，匹配不到任何规则而返回 421。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE / 大文件：关闭缓冲，流式透传。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 让上游的 Location 等头原样交给客户端（Mirrox 已把域名改写为镜像域）。
        proxy_redirect off;
    }

    location @redirect_to_login {
        return 302 https://$host/__auth/login?next=$scheme://$host$request_uri;
    }
}
